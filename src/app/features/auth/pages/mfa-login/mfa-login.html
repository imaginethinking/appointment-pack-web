<section class="mx-auto max-w-md p-8">
  <h1 class="mb-3 text-2xl font-bold text-brand-plum">Multi-factor authentication</h1>

  <p class="mb-6 text-brand-plum/70">
    Enter the six-digit code from your authenticator app to complete sign in.
  </p>

  <form class="space-y-4" [formGroup]="form" novalidate (ngSubmit)="completeLogin()">
    <div>
      <label class="mb-1 block font-medium text-brand-plum" for="code">Authentication code</label>

      <input
        id="code"
        class="w-full rounded border border-brand-plum/30 p-2 tracking-widest"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        formControlName="code"
      />

      @if (form.controls.code.invalid && form.controls.code.touched) {
        <p class="mt-1 text-sm text-brand-coral">Enter a six-digit numeric code.</p>
      }
    </div>

    <button class="btn btn-primary w-full" type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Verifying...' : 'Verify' }}
    </button>

    <button class="btn btn-secondary w-full" type="button" [disabled]="isSubmitting()" (click)="cancel()">
      Cancel
    </button>

    @if (errorMessage()) {
      <p class="text-brand-coral" role="alert">{{ errorMessage() }}</p>
    }
  </form>
</section>
