<section class="mx-auto max-w-md p-8">
  <h1 class="mb-3 text-2xl font-bold">
    Multi Factor Authentication
  </h1>

  <p class="mb-6">
    Enter the six digit code from authenticator.
  </p>

  <form
    #mfaForm="ngForm"
    class="space-y-4"
    novalidate
    (ngSubmit)="completeLogin(mfaForm)"
  >
    <div>
      <label
        class="mb-1 block font-medium"
        for="code"
      >
        Authentication code
      </label>

      <input
        #codeModel="ngModel"
        id="code"
        name="code"
        class="w-full rounded border p-2 tracking-widest"
        type="text"
        inputmode="numeric"
        autocomplete="one-time-code"
        required
        minlength="6"
        maxlength="6"
        pattern="[0-9]{6}"
        [(ngModel)]="code"
      />

      @if (codeModel.invalid && codeModel.touched) {
        <p class="mt-1 text-sm text-red-700">
          Enter a six digit numeric code.
        </p>
      }
    </div>

    <button
      class="w-full rounded bg-black p-2 text-white disabled:cursor-not-allowed disabled:opacity-50"
      type="submit"
      [disabled]="mfaForm.invalid || isSubmitting"
    >
      {{
        isSubmitting
          ? 'Verifying...'
          : 'Verify and login'
      }}
    </button>

    <button
      class="w-full rounded border p-2"
      type="button"
      [disabled]="isSubmitting"
      (click)="cancel()"
    >
      Cancel
    </button>

    @if (errorMessage) {
      <p
        class="text-red-700"
        role="alert"
      >
        {{ errorMessage }}
      </p>
    }
  </form>
</section>
