<section class="app-page">
  <div class="rounded-lg border border-brand-plum/20 bg-brand-off-white p-8 text-center">
    <p class="text-sm font-semibold uppercase tracking-wide text-brand-plum/60">
      404
    </p>

    <h1 class="mt-2 text-3xl font-bold text-brand-plum">
      Page not found
    </h1>

    <p class="mt-3 text-brand-plum/70">
      The page you requested does not exist or the address is no longer valid.
    </p>

    <div class="mt-6 flex flex-wrap justify-center gap-3">
      @if (isAuthenticated()) {
        <a
          routerLink="/home"
          class="btn btn-primary"
        >
          Return to dashboard
        </a>
      } @else {
        <a
          routerLink="/login"
          class="btn btn-primary"
        >
          Go to login
        </a>
      }
    </div>
  </div>
</section>
