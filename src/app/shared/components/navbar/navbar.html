<nav class="rounded-2xl border border-brand-peach/30 bg-brand-plum text-brand-off-white">
  <div class="w-full px-4 sm:px-6 lg:px-8">
    <div class="grid h-16 grid-cols-[1fr_auto_1fr] items-center">
      <a
        [routerLink]="isAuthenticated() ? '/home' : '/login'"
        class="col-start-1 justify-self-start text-lg font-bold text-brand-off-white"
        (click)="closeMenus()"
      >
        The Appointment Pack
      </a>

      @if (isAuthenticated()) {
        <div class="col-start-2 hidden items-center gap-1 justify-self-center lg:flex">
          <a
            routerLink="/home"
            routerLinkActive="bg-brand-peach text-brand-plum"
            [routerLinkActiveOptions]="{ exact: true }"
            class="btn btn-ghost"
          >
            Dashboard
          </a>

        </div>
      }

      <div class="col-start-3 flex items-center gap-2 justify-self-end">
        @if (isAuthenticated()) {
          <button
            type="button"
            class="btn btn-ghost h-10 w-10 p-0 lg:hidden"
            aria-label="Toggle navigation menu"
            aria-controls="mobile-navigation"
            [attr.aria-expanded]="mobileMenuOpen"
            (click)="toggleMobileMenu()"
          >
            @if (mobileMenuOpen) {
              <svg
                class="h-6 w-6"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M6 18 18 6M6 6l12 12"
                />
              </svg>
            } @else {
              <svg
                class="h-6 w-6"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"
                />
              </svg>
            }
          </button>

          <div class="relative">
            <button
              type="button"
              class="btn btn-ghost h-10 w-10 p-0"
              aria-label="Open profile menu"
              [attr.aria-expanded]="profileMenuOpen"
              (click)="toggleProfileMenu()"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 16 16"
                fill="currentColor"
                class="h-7 w-7"
                aria-hidden="true"
              >
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />

                <path
                  fill-rule="evenodd"
                  d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"
                />
              </svg>
            </button>

            @if (profileMenuOpen) {
              <div
                class="absolute right-0 z-50 mt-2 w-56 rounded-md border border-brand-peach bg-brand-off-white py-2 text-brand-plum shadow-lg"
              >
                <div class="border-b border-brand-peach px-4 py-3">
                  <p class="text-sm font-semibold">
                    Account
                  </p>
                </div>

                <a
                  routerLink="/profile"
                  class="block px-4 py-2 text-sm hover:bg-brand-pink"
                  (click)="closeMenus()"
                >
                  Profile
                </a>

                <a
                  routerLink="/profile/settings/mfa"
                  class="block px-4 py-2 text-sm hover:bg-brand-pink"
                  (click)="closeMenus()"
                >
                  Security and MFA
                </a>

                <div class="mt-2 border-t border-brand-peach px-2 pt-2">
                  <button
                    type="button"
                    class="btn btn-danger w-full"
                    (click)="logout()"
                  >
                    Log out
                  </button>
                </div>
              </div>
            }
          </div>
        } @else {
          <a
            routerLink="/login"
            routerLinkActive="bg-brand-peach text-brand-plum"
            class="btn btn-ghost"
          >
            Login
          </a>

          <a
            routerLink="/register"
            class="btn btn-secondary"
          >
            Register
          </a>
        }
      </div>
    </div>

    @if (isAuthenticated() && mobileMenuOpen) {
      <div
        id="mobile-navigation"
        class="border-t border-brand-peach/30 py-3 lg:hidden"
      >
        <div class="flex flex-col gap-1">
          <a
            routerLink="/home"
            routerLinkActive="bg-brand-peach text-brand-plum"
            [routerLinkActiveOptions]="{ exact: true }"
            class="btn btn-ghost w-full justify-start"
            (click)="closeMenus()"
          >
            Dashboard
          </a>
        </div>
      </div>
    }
  </div>
</nav>
